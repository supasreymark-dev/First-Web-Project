<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Admin</title>
            <link rel="stylesheet" href="/static/admin.css">
        </head>

        <body>
            <div class="wrapper">
                <div class="logo" hidden>
                    <span id="loading" hidden>+</span>
                </div>
                
                <div class="container">
                    <h2>Welcome Admin!</h2>

                    <h3 id="errorMessage">Invalid Username or Password</h3>

                    <form id="logInForm">
                        <div class="usernameField">
                            <label for="username">Username</label>
                            <input type="text" id="username" required>
                        </div>

                        <div class="passwordField">
                            <label for="password">Password</label>
                            <input type="password" id="password" required>
                        </div>

                        <button id="logIn" type="submit">Login</button>
                    </form>

                </div>

                <div class="time-and-date">
                    <span>
                        <span id="date">--</span> <span id="month">--</span> <span id="year">--</span>
                    </span>
                     <hr>
                    <span>
                        <span id="HOURS">00</span> : <span id="MINUTES">00</span> : <span id="SECONDS">00</span> <span id="meridiem">AM</span>
                    </span>
                </div>
            </div>

            <script src="/static/admin.js"></script>
        </body>
    </html>
