<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Sign Up Page</title>

            <link rel="stylesheet" href="./../static/signUp.css">
        </head>

        <body>
            
            <div class="wrapper">
                <div class="container">
                    <h1>Sign Up</h1>
                    <form id="login-form">
                        <div class="usernameField field">
                            <label for="username" class="usernameLabel">Username</label>
                            <input type="text" id="username" placeholder=" " required>
                        </div>

                        <div class="passwordField field">
                            <label for="password" class="passwordLabel">Password</label>
                            <input type="password" id="password" placeholder=" " required>
                        </div>

                        <div class="confirmPassField field">
                            <label for="confirmPass" class="confirmPassLabel">Confirm Password</label>
                            <input type="password" id="confirmPass" placeholder=" " required>
                        </div>

                        <p>Already have an account? <a href="./../index.html">Log In</a></p>

                        <button id="sign-up-btn">Sign Up</button>
                    </form>
                </div>
            </div>

            <script src="./../static/config.js"></script>
            <script src="./../static/signUp.js"></script>
        </body>
    </html>
